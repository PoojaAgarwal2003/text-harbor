services:
  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    volumes:
      - harbor-data:/data
    networks:
      - private
    mem_limit: 2g
    cpus: 2
    pids_limit: 192
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /home/harbor:rw,noexec,nosuid,size=32m,uid=10001,gid=10001

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - private
      - browser
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

networks:
  private:
    internal: true
  browser: {}

volumes:
  harbor-data: {}
